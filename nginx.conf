server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ──────────────────────────────────────────────
    # Nothing was compressed before this — the ~577KB main JS bundle and
    # ~29KB CSS bundle were served raw over the wire. gzip shrinks text-like
    # assets by roughly 65-75%; Vite's own build output already reports the
    # gzip-equivalent size for every chunk (~167KB for that same JS bundle),
    # so enabling this alone gets most of the way there with zero app changes.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        font/ttf
        font/otf
        image/svg+xml;

    # ── Caching ──────────────────────────────────────────────────
    # Vite content-hashes every filename under /assets/ (e.g.
    # index-B8mG7Qj3.js) — a new build always gets a new filename, so these
    # can be cached by the browser essentially forever with zero staleness
    # risk. `immutable` additionally tells the browser not to even
    # revalidate on reload.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Other static files (images, video, fonts placed directly in public/)
    # don't have hashed filenames, so a long max-age would risk serving a
    # stale file after a real content change. A day's caching still turns
    # every repeat visit from a full re-download into a free cache hit,
    # while still picking up a changed file within 24h.
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|mp4|webm|woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # index.html must never be cached — it's what points the browser at the
    # current build's hashed asset filenames, so a stale copy would serve
    # old asset URLs (either 404s once the old build is gone, or a broken
    # mix of old HTML with new assets).
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # React Router SPA fallback: any path that isn't a real static file
    # (e.g. /admin/enrollments) falls back to index.html so client-side
    # routing can handle it. Without this, refreshing/directly loading any
    # non-root route 404s, since nginx would otherwise look for a literal
    # file at that path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
