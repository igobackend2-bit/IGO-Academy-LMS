<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- description, canonical, and per-route OG/Twitter title+description are set
         dynamically and exactly once by App.jsx's default <SEO> + each page's own
         override (client/src/components/common/SEO.jsx) — nothing route-specific
         is hardcoded here, or Helmet's tags would duplicate alongside these static
         ones. Title is the one exception: browsers need it before JS runs, and
         Helmet's <title> singleton correctly replaces this static one either way. -->
    <title>IGO Academy Learning Platform</title>

    <!-- Open Graph (site-wide constants only) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IGo Academy" />
    <meta property="og:image" content="https://igoacademy.in/igo-logo.png" />

    <!-- Twitter Card (site-wide constants only) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://igoacademy.in/igo-logo.png" />

    <!-- Sora (display) + Manrope (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
